<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Scam Bank of India</h1>
    <h2>Enter your Details</h2>
    <br>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label><br>
            <input type="text" name="name" placeholder="Enter your name"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" name="email" placeholder="Enter your email"><br><br>
            <label for="password">Password:</label><br>
            <input type="password" name="password" placeholder="Enter your password"><br><br>
            <label for="mobile">Mobile Number:</label><br>
            <input type="number" name="mobile" placeholder="Enter your mobile number"><br><br>
        </fieldset>
        <br></br>
        <fieldset>
            <legend>Bank Information</legend>
            <label for="bank">Bank Name:</label><br>
            <input type="text" name="bank" placeholder="Enter your bank name"><br><br>
            <label for="account">Account Number:</label><br>
            <input type="number" name="account" placeholder="Enter your account number"><br><br>
            <label for="credit-card">Credit Card Number:</label><br>
            <input type="number" name="credit-card" placeholder="Enter your credit card number"><br><br>
            <label for="pin">Pin:</label><br><br>
            <input type="number" name="pin" placeholder="Enter your pin"><br><br>
        </fieldset>
        <br></br>
        <fieldset>
            <legend>Address</legend>
            <label for="h.no.">House Number:</label><br>
            <input type="text" name="h.no." placeholder="Enter your house number"><br><br>
            <label for="street">Street:</label><br>
            <input type="text" name="street" placeholder="Enter your street"><br><br>
            <label for="city">City:</label><br>
            <input type="text" name="city" placeholder="Enter your city"><br><br>
            <label for="state">State:</label><br>
            <input type="text" name="state" placeholder="Enter your state"><br><br>
            <label for="zip">ZIP Code:</label><br>
            <input type="number" name="zip" placeholder="Enter your ZIP code"><br><br>
        </fieldset>
        <br></br>
        <input type="checkbox" name="terms" required> I agree to be Scammed<br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
